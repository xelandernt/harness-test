[project]
name = "eur-expense-api"
version = "0.1.0"
description = "EurExpense — a TDD benchmark task for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pyrefly>=1.4.0",
    "pytest>=8.3,<9",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["app/**/*.py", "tests/**/*.py"]
python-version = "3.12"
preset = "default"
